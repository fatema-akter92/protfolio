<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="choloBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#choloBg)" />

  <!-- Navbar -->
  <rect x="40" y="30" width="720" height="50" rx="14" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5" />
  <circle cx="70" cy="55" r="14" fill="#14b8a6" />
  <text x="70" y="60" fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle">🇧🇩</text>
  <text x="95" y="61" fill="#ccfbf1" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">CholoGhuri (চলঘুরি)</text>
  <text x="260" y="61" fill="#99f6e4" font-family="sans-serif" font-size="12">Smart Bangladesh Tourism &amp; Travel Guide</text>
  <rect x="630" y="43" width="110" height="26" rx="8" fill="#14b8a6" />
  <text x="685" y="60" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Live on Render</text>

  <!-- 8 Divisions Tourism Grid -->
  <g transform="translate(40, 100)">
    
    <!-- Destination 1: Sajek Valley -->
    <g transform="translate(0, 0)">
      <rect width="225" height="350" rx="18" fill="#115e59" stroke="#2dd4bf" stroke-width="1" />
      <rect x="12" y="12" width="201" height="150" rx="12" fill="#0d9488" />
      <!-- Cloud & mountain icon -->
      <path d="M 40,120 Q 70,60 100,120 Q 130,50 160,120 Z" fill="#042f2e" />
      <circle cx="160" cy="50" r="15" fill="#fef08a" />
      <text x="112" y="145" fill="#ccfbf1" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Chittagong Division</text>

      <text x="20" y="195" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">Sajek Valley</text>
      <text x="20" y="215" fill="#5eead4" font-family="sans-serif" font-size="12" font-weight="600">Kingdom of Clouds</text>
      <text x="20" y="245" fill="#ccfbf1" font-family="sans-serif" font-size="11" opacity="0.8">Helipad sunset, Konglak peak, indigenous resort homestays.</text>

      <rect x="20" y="285" width="185" height="38" rx="12" fill="#14b8a6" />
      <text x="112" y="309" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Explore sajék →</text>
    </g>

    <!-- Destination 2: Cox's Bazar -->
    <g transform="translate(245, 0)">
      <rect width="225" height="350" rx="18" fill="#115e59" stroke="#2dd4bf" stroke-width="1" />
      <rect x="12" y="12" width="201" height="150" rx="12" fill="#0284c7" />
      <!-- Sea Waves -->
      <path d="M 20,110 Q 60,90 100,110 T 180,110 T 210,110" fill="none" stroke="#bae6fd" stroke-width="4" />
      <path d="M 20,130 Q 60,110 100,130 T 180,130 T 210,130" fill="none" stroke="#ffffff" stroke-width="3" />
      <circle cx="112" cy="65" r="22" fill="#fb923c" />
      <text x="112" y="145" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Longest Sea Beach</text>

      <text x="20" y="195" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">Cox's Bazar</text>
      <text x="20" y="215" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">Marine Drive &amp; Coral Reefs</text>
      <text x="20" y="245" fill="#ccfbf1" font-family="sans-serif" font-size="11" opacity="0.8">120 km unbroken beach, Inani coral stone, Himchari waterfalls.</text>

      <rect x="20" y="285" width="185" height="38" rx="12" fill="#0284c7" />
      <text x="112" y="309" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">View Tour Plan →</text>
    </g>

    <!-- Destination 3: Sundarbans -->
    <g transform="translate(490, 0)">
      <rect width="225" height="350" rx="18" fill="#115e59" stroke="#2dd4bf" stroke-width="1" />
      <rect x="12" y="12" width="201" height="150" rx="12" fill="#15803d" />
      <!-- Mangrove tree icon -->
      <path d="M 112,50 Q 80,80 112,120 Q 140,80 112,50 Z" fill="#166534" />
      <circle cx="112" cy="70" r="30" fill="#22c55e" opacity="0.8" />
      <text x="112" y="145" fill="#dcfce7" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">UNESCO World Heritage</text>

      <text x="20" y="195" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">Sundarbans</text>
      <text x="20" y="215" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="600">Mangrove Forest &amp; Bengal Tiger</text>
      <text x="20" y="245" fill="#ccfbf1" font-family="sans-serif" font-size="11" opacity="0.8">Kotka sanctuary, canal cruising, honey collection routes.</text>

      <rect x="20" y="285" width="185" height="38" rx="12" fill="#15803d" />
      <text x="112" y="309" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Explore Forest →</text>
    </g>

  </g>
</svg>

