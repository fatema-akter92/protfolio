<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Grid patterns -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Top App Bar -->
  <rect x="40" y="30" width="720" height="48" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="70" cy="54" r="6" fill="#ef4444" />
  <circle cx="90" cy="54" r="6" fill="#eab308" />
  <circle cx="110" cy="54" r="6" fill="#22c55e" />
  <text x="140" y="59" fill="#06b6d4" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">⚡ CyanVault — Modern Bank Management System</text>
  <rect x="620" y="42" width="120" height="24" rx="6" fill="#0891b2" />
  <text x="680" y="58" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Live on Vercel</text>

  <!-- 3D Virtual Card -->
  <g transform="translate(60, 110)">
    <rect width="320" height="190" rx="20" fill="url(#cardGrad)" stroke="#67e8f9" stroke-width="1.5" />
    <circle cx="280" cy="40" r="18" fill="#ffffff" fill-opacity="0.25" />
    <circle cx="260" cy="40" r="18" fill="#ffffff" fill-opacity="0.25" />
    <rect x="30" y="35" width="40" height="28" rx="5" fill="#fef08a" opacity="0.9" />
    <text x="30" y="115" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="16" letter-spacing="3">••••  ••••  ••••  4892</text>
    <text x="30" y="150" fill="#a5f3fc" font-family="sans-serif" font-size="10" font-weight="bold">CARDHOLDER</text>
    <text x="30" y="168" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">FATEMA AKTER</text>
    <text x="240" y="150" fill="#a5f3fc" font-family="sans-serif" font-size="10" font-weight="bold">EXPIRES</text>
    <text x="240" y="168" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">09/29</text>
  </g>

  <!-- Balance Widget -->
  <g transform="translate(420, 110)">
    <rect width="320" height="190" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="45" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">TOTAL NET BALANCE</text>
    <text x="30" y="85" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800">$48,250.80</text>
    <rect x="30" y="105" width="85" height="24" rx="12" fill="#065f46" />
    <text x="72" y="121" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">+ 14.8% MoM</text>
    <line x1="30" y1="145" x2="290" y2="145" stroke="#334155" stroke-width="1" />
    <text x="30" y="168" fill="#06b6d4" font-family="sans-serif" font-size="12" font-weight="bold">Quick Transfer</text>
    <text x="135" y="168" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="500">Deposit</text>
    <text x="210" y="168" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="500">Analytics</text>
  </g>

  <!-- Recent Ledger Transactions -->
  <g transform="translate(60, 325)">
    <rect width="680" height="145" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Real-time Financial Ledger</text>
    
    <!-- Row 1 -->
    <circle cx="45" cy="65" r="12" fill="#0891b2" />
    <text x="70" y="70" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Stripe Payment Settlement</text>
    <text x="420" y="70" fill="#94a3b8" font-family="sans-serif" font-size="12">Completed</text>
    <text x="640" y="70" fill="#22c55e" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">+$2,450.00</text>

    <!-- Row 2 -->
    <circle cx="45" cy="108" r="12" fill="#7c3aed" />
    <text x="70" y="113" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">AWS Cloud Hosting Server</text>
    <text x="420" y="113" fill="#94a3b8" font-family="sans-serif" font-size="12">Direct Debit</text>
    <text x="640" y="113" fill="#ef4444" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">-$149.99</text>
  </g>
</svg>

