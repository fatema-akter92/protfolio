<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ef" />
      <stop offset="100%" stop-color="#f5ede3" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ateBg)" />

  <!-- Navbar -->
  <rect x="40" y="30" width="720" height="50" rx="14" fill="#ffffff" stroke="#e7ded3" stroke-width="1.5" />
  <circle cx="70" cy="55" r="14" fill="#8c6d53" />
  <text x="70" y="60" fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle">🏺</text>
  <text x="95" y="61" fill="#4a3728" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">Atelier Terra</text>
  <text x="210" y="61" fill="#8c6d53" font-family="sans-serif" font-size="12">Artisanal Ceramics &amp; Japandi Living</text>
  <rect x="630" y="43" width="110" height="26" rx="8" fill="#8c6d53" />
  <text x="685" y="60" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Live on Render</text>

  <!-- Left: Signature Solstice Lamp Product Showcase -->
  <g transform="translate(40, 100)">
    <rect width="340" height="350" rx="18" fill="#ffffff" stroke="#e7ded3" stroke-width="1.5" />
    <rect x="15" y="15" width="310" height="230" rx="12" fill="#fdfbf7" />

    <!-- Pleated Lamp illustration -->
    <polygon points="170,50 110,130 230,130" fill="#f5ede3" stroke="#d5c4b1" stroke-width="1.5" />
    <!-- Pleats lines -->
    <line x1="170" y1="50" x2="130" y2="130" stroke="#d5c4b1" stroke-width="1" />
    <line x1="170" y1="50" x2="150" y2="130" stroke="#d5c4b1" stroke-width="1" />
    <line x1="170" y1="50" x2="170" y2="130" stroke="#d5c4b1" stroke-width="1" />
    <line x1="170" y1="50" x2="190" y2="130" stroke="#d5c4b1" stroke-width="1" />
    <line x1="170" y1="50" x2="210" y2="130" stroke="#d5c4b1" stroke-width="1" />
    <!-- Lamp base -->
    <rect x="166" y="130" width="8" height="50" fill="#a48b78" />
    <ellipse cx="170" cy="180" rx="35" ry="10" fill="#8c6d53" />
    <!-- Warm glow -->
    <circle cx="170" cy="110" r="45" fill="#fef08a" fill-opacity="0.25" />

    <text x="25" y="275" fill="#4a3728" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">The Pleated Solstice Table Lamp</text>
    <text x="25" y="295" fill="#8c6d53" font-family="sans-serif" font-size="12">Hand-pleated paper shade on stoneware ceramic</text>
    <text x="25" y="325" fill="#4a3728" font-family="sans-serif" font-size="18" font-weight="bold">$125.00</text>
    <rect x="235" y="303" width="90" height="32" rx="8" fill="#8c6d53" />
    <text x="280" y="323" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Add to Bag</text>
  </g>

  <!-- Right: Ceramics Collection Grid -->
  <g transform="translate(405, 100)">
    <!-- Vase 1 -->
    <rect x="0" y="0" width="355" height="165" rx="18" fill="#ffffff" stroke="#e7ded3" stroke-width="1.5" />
    <rect x="15" y="15" width="135" height="135" rx="12" fill="#fdfbf7" />
    <!-- Stoneware vase icon -->
    <path d="M 65,50 Q 82,75 60,115 Q 82,125 105,115 Q 82,75 100,50 Z" fill="#b09b88" />
    
    <text x="170" y="45" fill="#4a3728" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800">Tactile Stoneware Vase</text>
    <text x="170" y="70" fill="#8c6d53" font-family="sans-serif" font-size="11">Raw terracotta with matte speckled glaze</text>
    <text x="170" y="100" fill="#4a3728" font-family="sans-serif" font-size="16" font-weight="bold">$68.00</text>
    <rect x="170" y="115" width="110" height="28" rx="8" fill="#f5ede3" stroke="#d5c4b1" />
    <text x="225" y="133" fill="#6d5440" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">View Details →</text>

    <!-- Bowl 2 -->
    <rect x="0" y="185" width="355" height="165" rx="18" fill="#ffffff" stroke="#e7ded3" stroke-width="1.5" />
    <rect x="15" y="15" transform="translate(0, 185)" width="135" height="135" rx="12" fill="#fdfbf7" />
    <ellipse cx="82" cy="265" rx="45" ry="22" fill="#c4b5a5" stroke="#a48b78" stroke-width="2" />
    
    <text x="170" y="230" fill="#4a3728" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800">Matcha Ceremonial Bowl</text>
    <text x="170" y="255" fill="#8c6d53" font-family="sans-serif" font-size="11">Wheel-thrown Japanese inspired stoneware</text>
    <text x="170" y="285" fill="#4a3728" font-family="sans-serif" font-size="16" font-weight="bold">$45.00</text>
    <rect x="170" y="300" width="110" height="28" rx="8" fill="#f5ede3" stroke="#d5c4b1" />
    <text x="225" y="318" fill="#6d5440" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">View Details →</text>
  </g>
</svg>

