<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="traceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#traceBg)" />

  <!-- Navbar -->
  <rect x="40" y="30" width="720" height="50" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
  <circle cx="70" cy="55" r="14" fill="#0284c7" />
  <text x="70" y="60" fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle">🔍</text>
  <text x="95" y="61" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">TraceBack AI</text>
  <text x="220" y="61" fill="#94a3b8" font-family="sans-serif" font-size="12">Smart Lost &amp; Found Recovery • DIU Smart City</text>
  <rect x="630" y="43" width="110" height="26" rx="8" fill="#0284c7" />
  <text x="685" y="60" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Live on Render</text>

  <!-- Left: Interactive Leaflet Map Preview -->
  <g transform="translate(40, 100)">
    <rect width="430" height="360" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    
    <!-- Map grid lines / roads -->
    <path d="M 30,120 Q 150,80 300,160 T 400,240" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round" />
    <path d="M 80,30 L 120,330" fill="none" stroke="#475569" stroke-width="6" />
    <path d="M 220,30 L 250,330" fill="none" stroke="#475569" stroke-width="6" />
    <path d="M 30,220 L 400,180" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="6,6" />

    <!-- Campus Zones -->
    <rect x="130" y="60" width="80" height="60" rx="8" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" />
    <text x="170" y="95" fill="#bae6fd" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">CSE Building</text>

    <rect x="230" y="180" width="100" height="70" rx="8" fill="#047857" fill-opacity="0.3" stroke="#10b981" />
    <text x="280" y="220" fill="#a7f3d0" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Central Library</text>

    <!-- Map Pin 1: Lost Laptop -->
    <circle cx="160" cy="110" r="14" fill="#ef4444" />
    <circle cx="160" cy="110" r="6" fill="#ffffff" />
    <rect x="180" y="95" width="120" height="30" rx="6" fill="#0f172a" stroke="#ef4444" />
    <text x="190" y="114" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">🔴 Lost: HP Laptop</text>

    <!-- Map Pin 2: Found Keys -->
    <circle cx="280" cy="200" r="14" fill="#22c55e" />
    <circle cx="280" cy="200" r="6" fill="#ffffff" />
    <rect x="295" y="185" width="115" height="30" rx="6" fill="#0f172a" stroke="#22c55e" />
    <text x="305" y="204" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">🟢 Found: Key Ring</text>

    <!-- Map Controls overlay -->
    <rect x="15" y="15" width="160" height="28" rx="8" fill="#0f172a" fill-opacity="0.9" />
    <text x="25" y="33" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">📍 Campus Radius: 2.5km</text>
  </g>

  <!-- Right: Recent Feed & AI Matcher -->
  <g transform="translate(490, 100)">
    <!-- AI Matcher widget -->
    <rect width="270" height="110" rx="18" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="20" y="32" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">⚡ AI IMAGE SIMILARITY</text>
    <text x="20" y="60" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">98.4% Match</text>
    <text x="20" y="85" fill="#94a3b8" font-family="sans-serif" font-size="11">Claimant matched student ID &amp; serial</text>

    <!-- Feed Card 1 -->
    <rect x="0" y="125" width="270" height="110" rx="16" fill="#1e293b" stroke="#334155" />
    <circle cx="30" cy="155" r="12" fill="#ef4444" />
    <text x="30" y="160" fill="#ffffff" font-size="11" text-anchor="middle">!</text>
    <text x="50" y="158" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Wallet &amp; Student ID</text>
    <text x="20" y="185" fill="#94a3b8" font-family="sans-serif" font-size="11">Location: DIU Cafeteria 2nd Fl</text>
    <rect x="20" y="198" width="80" height="22" rx="6" fill="#0284c7" />
    <text x="60" y="213" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Verify Claim</text>

    <!-- Feed Card 2 -->
    <rect x="0" y="250" width="270" height="110" rx="16" fill="#1e293b" stroke="#334155" />
    <circle cx="30" cy="280" r="12" fill="#22c55e" />
    <text x="30" y="285" fill="#ffffff" font-size="11" text-anchor="middle">✓</text>
    <text x="50" y="283" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Calculus Notebook</text>
    <text x="20" y="310" fill="#94a3b8" font-family="sans-serif" font-size="11">Returned successfully to owner</text>
    <text x="20" y="335" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">Resolved 5 mins ago</text>
  </g>
</svg>

