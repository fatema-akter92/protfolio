<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="agriBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="gradCam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#eab308" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#agriBg)" />

  <!-- Navbar -->
  <rect x="40" y="30" width="720" height="50" rx="14" fill="#065f46" stroke="#34d399" stroke-width="1.5" />
  <circle cx="70" cy="55" r="14" fill="#10b981" />
  <text x="70" y="60" fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle">🌾</text>
  <text x="95" y="61" fill="#ecfdf5" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">AgriXAI Smart Crop Advisor</text>
  <text x="320" y="61" fill="#6ee7b7" font-family="sans-serif" font-size="12">Grad-CAM XAI • Rice (ধান) &amp; Jute (পাট) Diseases</text>
  <rect x="630" y="43" width="110" height="26" rx="8" fill="#10b981" />
  <text x="685" y="60" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Live on Render</text>

  <!-- Left: Leaf Disease Scan & Grad-CAM Visual Heatmap -->
  <g transform="translate(40, 100)">
    <rect width="340" height="350" rx="18" fill="#064e3b" stroke="#059669" stroke-width="1.5" />
    
    <!-- Leaf illustration -->
    <path d="M 50,280 C 70,120 220,50 300,70 C 260,200 180,270 50,280 Z" fill="#15803d" />
    <path d="M 50,280 Q 180,180 300,70" stroke="#86efac" stroke-width="3" fill="none" />

    <!-- Grad-CAM Heatmap overlay -->
    <circle cx="170" cy="160" r="50" fill="url(#gradCam)" />
    <circle cx="220" cy="120" r="35" fill="url(#gradCam)" />

    <rect x="20" y="20" width="150" height="26" rx="8" fill="#022c22" fill-opacity="0.8" />
    <text x="95" y="37" fill="#86efac" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Grad-CAM Activation</text>

    <rect x="20" y="295" width="300" height="40" rx="10" fill="#022c22" />
    <text x="35" y="320" fill="#fef08a" font-family="sans-serif" font-size="12" font-weight="bold">🔴 Bacterial Leaf Blight (ধানের ব্লাইট)</text>
  </g>

  <!-- Right: Diagnosis & Bengali Prescription Advisory -->
  <g transform="translate(405, 100)">
    <rect width="355" height="350" rx="18" fill="#064e3b" stroke="#059669" stroke-width="1.5" />
    
    <text x="25" y="40" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="bold">DIAGNOSIS &amp; ADVICE IN BENGALI</text>
    <text x="25" y="70" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">৯৬.৮% নির্ভুলতা (Accuracy)</text>

    <!-- Soil Health Gauge -->
    <rect x="25" y="90" width="305" height="60" rx="12" fill="#022c22" />
    <text x="40" y="115" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">মাটির পুষ্টি সূচক (Soil Score)</text>
    <text x="290" y="115" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold">৭৮/১০০</text>
    <rect x="40" y="125" width="275" height="8" rx="4" fill="#064e3b" />
    <rect x="40" y="125" width="215" height="8" rx="4" fill="#10b981" />

    <!-- Advisory Steps -->
    <g transform="translate(25, 170)">
      <text x="0" y="15" fill="#fde047" font-family="sans-serif" font-size="13" font-weight="bold">কৃষি পরামর্শ ও সমাধান (BARC মানক):</text>
      
      <circle cx="8" cy="40" r="4" fill="#34d399" />
      <text x="20" y="44" fill="#ffffff" font-family="sans-serif" font-size="12">ইউরিয়া সারের অতিরিক্ত ব্যবহার বন্ধ করুন।</text>

      <circle cx="8" cy="70" r="4" fill="#34d399" />
      <text x="20" y="74" fill="#ffffff" font-family="sans-serif" font-size="12">প্রতি হেক্টরে ৬০ কেজি পটাশ প্রয়োগ করুন।</text>

      <circle cx="8" cy="100" r="4" fill="#34d399" />
      <text x="20" y="104" fill="#ffffff" font-family="sans-serif" font-size="12">কপার অক্সিক্লোরাইড স্প্রে করার পরামর্শ।</text>
    </g>

    <rect x="25" y="295" width="305" height="38" rx="10" fill="#10b981" />
    <text x="177" y="319" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">পূর্ণাঙ্গ প্রেসক্রিপশন ডাউনলোড করুন ↓</text>
  </g>
</svg>

