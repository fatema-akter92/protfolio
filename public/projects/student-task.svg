<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="taskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#taskBg)" />

  <!-- Navbar -->
  <rect x="40" y="30" width="720" height="50" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
  <circle cx="70" cy="55" r="14" fill="#6366f1" />
  <text x="70" y="60" fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle">⚡</text>
  <text x="95" y="61" fill="#e0e7ff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">Student Task Manager</text>
  <text x="280" y="61" fill="#a5b4fc" font-family="sans-serif" font-size="12">Study &amp; Productivity Suite • React 18 + Django REST</text>
  <rect x="620" y="43" width="120" height="26" rx="8" fill="#4f46e5" />
  <text x="680" y="60" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Live on Vercel</text>

  <!-- Left: Pomodoro Study Focus Timer -->
  <g transform="translate(40, 100)">
    <rect width="320" height="350" rx="18" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5" />
    
    <!-- Timer Ring -->
    <circle cx="160" cy="150" r="85" fill="none" stroke="#312e81" stroke-width="12" />
    <circle cx="160" cy="150" r="85" fill="none" stroke="#818cf8" stroke-width="12" stroke-dasharray="400" stroke-dashoffset="110" stroke-linecap="round" />
    
    <text x="160" y="145" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="800" text-anchor="middle">24:59</text>
    <text x="160" y="175" fill="#a5b4fc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">DEEP STUDY FOCUS</text>

    <!-- Controls -->
    <rect x="60" y="270" width="95" height="38" rx="10" fill="#6366f1" />
    <text x="107" y="294" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Pause ⏸</text>

    <rect x="165" y="270" width="95" height="38" rx="10" fill="#312e81" stroke="#6366f1" />
    <text x="212" y="294" fill="#c7d2fe" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Skip ⏭</text>
  </g>

  <!-- Right: Tasks & Subject Progress Checklist -->
  <g transform="translate(385, 100)">
    <rect width="375" height="350" rx="18" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5" />
    
    <text x="25" y="38" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">Today's Academic Priority Tasks</text>
    
    <!-- Task Item 1 -->
    <g transform="translate(25, 60)">
      <rect width="325" height="52" rx="12" fill="#312e81" stroke="#4f46e5" stroke-width="1" />
      <circle cx="26" cy="26" r="10" fill="#22c55e" />
      <text x="26" y="30" fill="#ffffff" font-size="10" text-anchor="middle">✓</text>
      <text x="48" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">CSE499: FYDP AI Model Training</text>
      <text x="48" y="42" fill="#818cf8" font-family="sans-serif" font-size="11">Due 8:00 PM • Completed</text>
    </g>

    <!-- Task Item 2 -->
    <g transform="translate(25, 122)">
      <rect width="325" height="52" rx="12" fill="#312e81" stroke="#4f46e5" stroke-width="1" />
      <circle cx="26" cy="26" r="10" fill="#eab308" />
      <text x="26" y="30" fill="#ffffff" font-size="10" text-anchor="middle">•</text>
      <text x="48" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Compiler Design AST Tree Generation</text>
      <text x="48" y="42" fill="#fde047" font-family="sans-serif" font-size="11">In Progress • 2 hrs remaining</text>
    </g>

    <!-- Task Item 3 -->
    <g transform="translate(25, 184)">
      <rect width="325" height="52" rx="12" fill="#312e81" stroke="#4f46e5" stroke-width="1" />
      <circle cx="26" cy="26" r="10" fill="#64748b" />
      <text x="48" y="24" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold">Algorithms: Graph Shortest Path Lab</text>
      <text x="48" y="42" fill="#94a3b8" font-family="sans-serif" font-size="11">Pending review tomorrow</text>
    </g>

    <!-- Subject Progress Meters -->
    <g transform="translate(25, 255)">
      <text x="0" y="15" fill="#a5b4fc" font-family="sans-serif" font-size="12" font-weight="bold">SEMESTER SYLLABUS COMPLETION</text>
      <rect x="0" y="28" width="325" height="10" rx="5" fill="#312e81" />
      <rect x="0" y="28" width="280" height="10" rx="5" fill="#6366f1" />
      <text x="325" y="55" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="end">86% Completed</text>
    </g>
  </g>
</svg>

